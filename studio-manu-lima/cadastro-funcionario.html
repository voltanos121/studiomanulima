<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de funcionário | Studio Manu Lima</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="cadastro-funcionario.js"></script></head><body class="admin-body"><main class="login-wrap"><form class="login-card" id="enrollForm"><span class="eyebrow">Convite da equipe</span><h1>Bem-vinda ao <em>Studio.</em></h1><p id="inviteInfo">Validando seu convite...</p><label>Nome de usuário<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9._-]+" autocomplete="username" placeholder="Ex.: luiza"></label><label>Senha<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label><label>Confirmar senha<input name="confirm" type="password" required minlength="8" autocomplete="new-password"></label><button class="button button-dark button-full" id="enrollButton">Criar meu acesso</button><div id="enrollFeedback" class="form-feedback" role="status"></div><small>O convite é individual, expira e só pode ser usado uma vez. Peça um novo QR Code à administradora se ele não funcionar.</small></form></main></body></html>
